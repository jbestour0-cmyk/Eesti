<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A5CAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eesti">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Eesti sõnad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : une colonne façon appli de poche, 520px max, carte au centre, gros boutons au pouce */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EEF3;
  --ink:#0F1A24; --ink-2:#4A5865; --ink-3:#7C8995;
  --line:#D5DEE6; --accent:#0A5CAB; --accent-ink:#FFFFFF; --accent-soft:#DFEBF7;
  --good:#23744A; --good-soft:#DCEFE3; --bad:#B03F2B; --bad-soft:#F6E0DA; --warn:#94650E; --warn-soft:#F5EAD3;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --surface:#131C24; --surface-2:#1A252F;
  --ink:#E6EDF3; --ink-2:#A3B1BE; --ink-3:#74838F;
  --line:#25323D; --accent:#5DA8F2; --accent-ink:#06121D; --accent-soft:#14293C;
  --good:#5DC08B; --good-soft:#12291E; --bad:#EE826B; --bad-soft:#2E1813; --warn:#E2B158; --warn-soft:#2A2112;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --surface:#131C24; --surface-2:#1A252F;
  --ink:#E6EDF3; --ink-2:#A3B1BE; --ink-3:#74838F;
  --line:#25323D; --accent:#5DA8F2; --accent-ink:#06121D; --accent-soft:#14293C;
  --good:#5DC08B; --good-soft:#12291E; --bad:#EE826B; --bad-soft:#2E1813; --warn:#E2B158; --warn-soft:#2A2112;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 96px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-3);letter-spacing:0}

/* accueil */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end;padding-top:6px}
.hero .due{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .due-l{color:var(--ink-2);font-size:15px;grid-column:1}
.streak{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.streak b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--warn)}
.streak span{font-size:13px;color:var(--ink-3)}
.cta{width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:20px;padding:18px;letter-spacing:-.01em}
.cta:disabled{opacity:.45;cursor:default}
.ghost{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px;font-weight:700;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-3)}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:8px 0 0}
.hint{color:var(--ink-3);font-size:14px;margin:0}
.themes{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.theme{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.theme:last-child{border-bottom:0}
.theme input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.theme label{display:flex;flex-direction:column;min-width:0}
.theme .tn{font-weight:700}
.theme .te{font-size:13px;color:var(--ink-3);font-style:italic}
.theme .tc{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:2/4;height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)}.bar .l{background:var(--accent)}
details.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.guide summary{font-weight:700;cursor:pointer}
.guide dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 4px}
.guide dt{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent)}
.guide dd{margin:0;color:var(--ink-2);font-size:15px;align-self:center}

/* session */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:6px}
.prog .bar i{background:var(--accent);transition:width .25s}
.prog span{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--ink-3);font-size:14px;font-weight:700;padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chip.new{color:var(--warn)}
.dirl{font-size:13px;color:var(--ink-3)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.12;letter-spacing:-.02em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.prompt.fr{font-family:var(--f-body);font-weight:700;font-size:clamp(24px,6.5vw,30px);letter-spacing:0}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.answer .a{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.answer .a.fr{font-family:var(--f-body);font-size:22px}
.pron{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.ex{font-size:15px;color:var(--ink-2)}
.say{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.verdict{border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.meh{background:var(--warn-soft);color:var(--warn)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font-size:19px}
.type input:focus{border-color:var(--accent);outline:0}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;min-width:42px;padding:7px 0;font-size:18px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:15px}
.grades small{font-weight:400;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grades .g1{color:var(--bad)}.grades .g3{color:var(--warn)}.grades .g4{color:var(--good)}.grades .g5{color:var(--accent)}
.grades .sug{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
.done p{margin:0;color:var(--ink-2)}

/* lexique */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px}
.lex{display:flex;flex-direction:column;gap:18px}
.lex h3{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.lex ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lex li{display:grid;grid-template-columns:10px 1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lex li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--accent)}.dot.k{background:var(--good)}
.lex .w{display:flex;flex-direction:column;min-width:0}
.lex .w b{overflow-wrap:anywhere}
.lex .w span{font-size:14px;color:var(--ink-2)}
.lex .w em{font-style:normal;font-size:13px;color:var(--accent)}
.lex li button{border:0;background:transparent;font-size:18px;padding:6px;color:var(--ink-3)}

/* réglages */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-weight:700}
.row small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:700}
.btns .danger{color:var(--bad)}
.msg{font-size:14px;color:var(--good);min-height:1em;margin:0}
.msg.err{color:var(--bad)}
.row-sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 14px 0}

/* barre d'onglets en bas, au pouce */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:flex;gap:2px;width:100%;max-width:520px}
.nav button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:700;color:var(--ink-3);min-height:52px}
.nav button .ic{font-size:20px;line-height:1}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* XP & niveaux */
.xp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.xp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.xp-lv{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.xp-lv small{font-family:var(--f-body);font-weight:400;color:var(--ink-3);font-size:13px;letter-spacing:0}
.xp-n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{height:10px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--accent));border-radius:9px;transition:width .6s}
.sxp{font-size:13px;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}

/* expression du jour */
.phrase{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.phrase .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.phrase .e{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.phrase .f{font-weight:700;color:var(--ink)}
.phrase p{margin:0;font-size:14.5px;color:var(--ink-2)}
.phrase .say{align-self:flex-start;margin-top:4px}

/* toasts, confettis */
.toasts{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .25s ease-out;max-width:100%;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* récap de fin */
.recap{width:100%;display:flex}
.recap div{flex:1;align-items:center}
.done .xp{width:100%;text-align:left}
.recap b{color:var(--ink)}
.recap .xpv{color:var(--warn)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.badge .bi{font-size:34px;line-height:1.15}
.badge b{font-size:15px;line-height:1.25}
.badge span{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.badge.off .bi{filter:grayscale(1);opacity:.35}
.badge.off b{color:var(--ink-2)}
.badge .bp{width:80%;height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:4px}
.badge .bp i{display:block;height:100%;background:var(--accent)}
.badge em{font-style:normal;font-size:12px;color:var(--good);font-weight:700}

/* couleur d'accent par thème (variables --tc injectées par le JS) */
.card[data-th]{border-top:5px solid var(--tc)}
.card[data-th] .chip{color:var(--tc)}
.theme[data-th]{box-shadow:inset 4px 0 0 var(--tc);border-radius:0}
.theme[data-th]:first-child{border-top-left-radius:var(--r)}.theme[data-th]:last-child{border-bottom-left-radius:var(--r)}
.theme[data-th] input{accent-color:var(--tc)}
.theme[data-th] .bar .l{background:var(--tc)}
.lex section[data-th] h3{color:var(--tc)}

/* retournement 3D */
.card{transform-origin:50% 50%;backface-visibility:hidden}
.flip-out{animation:flipOut .16s ease-in forwards}
.flip-in{animation:flipIn .24s ease-out}
@keyframes flipOut{from{transform:perspective(1100px) rotateY(0)}to{transform:perspective(1100px) rotateY(90deg)}}
@keyframes flipIn{from{transform:perspective(1100px) rotateY(-90deg)}to{transform:perspective(1100px) rotateY(0)}}

/* jeux */
.games{display:flex;flex-direction:column;gap:10px}
.game{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.game .gi{grid-row:1/3;font-size:32px;line-height:1}
.game b{font-family:var(--f-display);font-size:19px}
.game span{font-size:14px;color:var(--ink-3)}
.game:disabled{opacity:.5;cursor:default}
.ghead{display:flex;align-items:center;gap:12px}
.ghead .x{margin-right:auto}
.chrono{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.tile{min-height:58px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere;transition:transform .12s,background .15s}
.tile.et{font-family:var(--f-display);font-size:17px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.55}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.tf[data-th]{border-top:5px solid var(--tc)}
.tf .tfe{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,36px);line-height:1.15;overflow-wrap:anywhere}
.tf .tff{font-size:20px;font-weight:700;color:var(--ink-2)}
.tf .eq{color:var(--ink-3);font-size:14px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtns button{border:0;border-radius:var(--r);padding:22px 8px;font-family:var(--f-display);font-weight:800;font-size:22px}
.tfbtns .v{background:var(--good-soft);color:var(--good)}
.tfbtns .f{background:var(--bad-soft);color:var(--bad)}
.tbar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.tbar.low i{background:var(--bad)}
.fb{min-height:1.5em;margin:0;font-size:15px;font-weight:700;text-align:center}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.pick{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pick button{border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;text-align:left;font-weight:700}
.pick button:last-child{border-bottom:0}
.pick button[data-th]{box-shadow:inset 4px 0 0 var(--tc)}
.pick small{font-weight:400;color:var(--ink-3);font-size:13px;white-space:nowrap}

@media (max-width:460px){.brand small{display:none}.brand{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">Eesti sõnad <small>estonien de poche</small></div>
    <span class="sxp" id="lvChip"></span>
  </header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Navigation"><div class="nav-in" role="tablist"></div></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
// Vocabulaire : [estonien, français, prononciation, exemple ET?, exemple FR?, verify?]

// ---------- SRS (SM-2) ----------
function sm2(c, q){
  // c: {n, ef, iv} ; q: 1 (raté) 3 (difficile) 4 (bien) 5 (facile)
  let n = c.n||0, ef = c.ef||2.5, iv = c.iv||0;
  if (q < 3){ n = 0; iv = 1; }
  else {
    if (n === 0) iv = (q === 5) ? 3 : 1;
    else if (n === 1) iv = (q === 3) ? 3 : 6;
    else iv = Math.max(iv + 1, Math.round(iv * ef * (q === 3 ? 0.8 : 1) * (q === 5 ? 1.3 : 1)));
    n += 1;
  }
  ef = Math.max(1.3, ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  return { n, ef: Math.round(ef*100)/100, iv };
}

function merge(s){
  const d = JSON.parse(JSON.stringify(DEFAULT));
  const out = Object.assign(d, s || {});
  out.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT.settings)), (s && s.settings) || {});
  out.cards = out.cards || {}; out.intro = out.intro || {}; out.reviews = out.reviews || {};

  out.games = Object.assign(JSON.parse(JSON.stringify(DEFAULT.games)), (s && s.games) || {});
  out.games.pairs = Object.assign({}, out.games.pairs);
  // progression d'avant les XP : 10 XP offerts par mot déjà vu
  if (!s || typeof s.xp !== "number") out.xp = Object.keys(out.cards).length * 10;
  return out;
}

let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /^et([-_]|$)/i.test(v.lang)) || null;
  } catch(e){ VOICE = null; }
  document.querySelectorAll("[data-say]").forEach(b => b.hidden = !VOICE);
  const st = document.getElementById("voiceState");
  if (st) st.textContent = VOICE ? "Voix estonienne trouvée : " + VOICE.name : "Aucune voix estonienne sur cet appareil. L'appli marche sans le son.";
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!VOICE) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/…/g,"")); u.voice = VOICE; u.lang = VOICE.lang; u.rate = 0.85; speechSynthesis.speak(u); } catch(e){}
}

// ---------- utilitaires ----------
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function norm(s){ return s.toLowerCase().replace(/[!?.,…;:«»"'()]/g," ").replace(/\s+/g," ").trim(); }
function bare(s){ return norm(s).normalize("NFD").replace(/[̀-ͯ]/g,""); }
function check(input, target){
  const a = norm(input), b = norm(target);
  if (!a) return "no";
  if (a === b) return "ok";
  if (bare(a) === bare(b)) return "meh";
  return "no";
}

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let AC = null;
function sfx(kind){
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime + 0.01;
    const notes = {
      ok:   [[660,0,.10],[990,.08,.16]],
      no:   [[240,0,.14],[170,.11,.22]],
      tap:  [[880,0,.05]],
      done: [[523,0,.12],[659,.11,.12],[784,.22,.12],[1047,.33,.32]],
      level:[[392,0,.1],[523,.1,.1],[659,.2,.1],[784,.3,.1],[1047,.4,.4]],
    }[kind] || [];
    notes.forEach(([f, d, len]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "no" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(g); g.connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + len + 0.03);
    });
  } catch(e){}
}

// ---------- confettis (canvas léger) ----------
function confetti(){
  if (!S.settings.confetti || reducedMotion()) return;
  const cv = h("canvas", {class:"confetti", "aria-hidden":"true"}); document.body.append(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--good","--warn","--bad"].map(v => cs.getPropertyValue(v).trim()).concat(["#F2C94C","#4A9FE8"]);
  const P = Array.from({length:110}, () => ({ x: W/2 + (Math.random()-.5)*W*.4, y: H*.4, vx:(Math.random()-.5)*10, vy:-Math.random()*12-5,
    r:Math.random()*6, vr:(Math.random()-.5)*.35, w:6+Math.random()*6, h:4+Math.random()*4, c:cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now(), LIFE = 2600;
  (function step(now){
    const el = now - t0; ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - LIFE*.6) / (LIFE*.4));
    P.forEach(p => { p.vy += .3; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore(); });
    if (el < LIFE) requestAnimationFrame(step); else cv.remove();
  })(t0);
}

    due = enabledItems().filter(i => S.cards[i.id]).sort((a,b) => S.cards[a.id].due - S.cards[b.id].due).slice(0, S.settings.size);
  }
  const q = [...due, ...fresh].map(i => ({ item:i, isNew: !S.cards[i.id], again:false }));
  if (!q.length){ return; }
  // mélange léger : les nouvelles intercalées
  for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [q[i], q[j]] = [q[j], q[i]]; }
  session = { queue:q, pos:0, total:q.length, revealed:false, typed:null, verdict:null, correct:0, seen:0, xp:0, run:0, bestRun:0, misses:0 };
  prepCard(); render();
}
function prepCard(){
  const cur = session.queue[session.pos]; if (!cur) return;

  session.revealed = false; session.typed = null; session.verdict = null;
}
function renderSession(){

      const inp = h("input", {id:"ans", type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", lang:"et", placeholder:"Écris en estonien…", "aria-label":"Ta réponse en estonien",

  }

  const ans = h("div", {class:"answer"});

  if (cur.dir === "fr") ans.append(h("div", {}, h("button", {class:"say", "data-say":true, onclick:() => say(it.et)}, "🔊 Écouter")));
  card.append(ans);
  wrap.append(card);

  const c = S.cards[it.id] || {n:0, ef:2.5, iv:0};
  const sug = s.verdict === "ok" ? 4 : s.verdict === "meh" ? 3 : s.verdict === "no" ? 1 : null;
  wrap.append(h("div", {class:"grades"}, [[1,"Raté"],[3,"Difficile"],[4,"Bien"],[5,"Facile"]].map(([q,l]) =>
    h("button", {class:"g"+q + (sug === q ? " sug" : ""), onclick:() => grade(q)}, l, h("small", {}, q < 3 ? "à revoir" : fmtIv(sm2(c,q).iv)))
  )));

}
function submitTyped(){
  const s = session, cur = s.queue[s.pos], i = $("#ans");
  const v = i ? i.value : "";
  if (s.revealed || flipping) return;
  s.typed = v.trim(); s.verdict = check(v, cur.item.et);
  if (s.verdict === "ok") S.stats.typedOk++;
  sfx(s.verdict === "no" ? "no" : "ok");
  flip(() => { s.revealed = true; render(); say(cur.item.et); });
}
// retournement 3D de la carte : demi-tour sortant, nouveau contenu, demi-tour entrant
let flipping = false;
function flip(fn){
  const card = $(".card");
  if (!S.settings.flip || reducedMotion() || !card){ fn(); return; }
  if (flipping) return;
  flipping = true; card.classList.add("flip-out");
  setTimeout(() => { flipping = false; fn(); const c = $(".card"); if (c) c.classList.add("flip-in"); }, 160);
}
function grade(q){
  const s = session, cur = s.queue[s.pos], id = cur.item.id, t = today();
  if (cur.isNew && !cur.again){ S.intro[t] = (S.intro[t] || 0) + 1; }
  const prev = S.cards[id] || {n:0, ef:2.5, iv:0};
  const next = sm2(prev, q);
  S.cards[id] = { ...next, due: t + next.iv, last: t };
  S.reviews[t] = (S.reviews[t] || 0) + 1;
  s.seen++; if (q >= 3) s.correct++;
  // XP, séries, sons
  const gain = XP_GRADE[q] * (s.verdict === "ok" ? 2 : 1);
  s.xp += addXp(gain);
  if (q >= 3){ s.run++; s.bestRun = Math.max(s.bestRun, s.run); } else { s.run = 0; s.misses++; }
  S.stats.bestRun = Math.max(S.stats.bestRun, s.bestRun);
  if (!s.verdict) sfx(q >= 3 ? "ok" : "no");
  if (q < 3 && !cur.again) s.queue.push({ item: cur.item, isNew: cur.isNew, again: true });
  // série
  if (S.lastDay !== t){ S.streak = (S.lastDay === t - 1) ? S.streak + 1 : 1; S.lastDay = t; }
  S.stats.bestStreak = Math.max(S.stats.bestStreak, S.streak);
  // garde seulement 60 jours d'historique
  for (const k of Object.keys(S.intro)) if (+k < t - 60) delete S.intro[k];
  for (const k of Object.keys(S.reviews)) if (+k < t - 60) delete S.reviews[k];
  s.pos++;
  const finished = s.pos >= s.queue.length;
  if (finished){
    S.stats.sessions++;
    if (s.misses === 0 && s.seen >= 5) S.stats.perfect++;
  }
  save();
  prepCard(); render();
  if (finished){ sfx("done"); confetti(); }
  checkBadges();
}

}

// --- Paires ---
function renderPairsPick(){
  const themes = THEMES.filter(t => pairsCandidates(t.id).length >= 6);
  return h("div", {style:"display:flex;flex-direction:column;gap:14px"},
    gameHead(null),
    h("h2", {}, "Paires : choisis un thème"),
    h("div", {class:"pick"}, themes.map(t => {
      const r = S.games.pairs[t.id];
      return h("button", {"data-th":th(t.id), onclick:() => startPairs(t.id)}, t.name, h("small", {}, r ? "Record " + fmtS(r) : "—"));
    }))
  );
}
function pairsCandidates(tid){
  const seen = new Set(), out = [];
  shuffle(poolItems(tid).filter(i => i.et.length <= 26 && shortFr(i.fr).length <= 30)).forEach(i => {
    const k = bare(shortFr(i.fr)); if (seen.has(k) || seen.has("et:" + bare(i.et))) return;
    seen.add(k); seen.add("et:" + bare(i.et)); out.push(i);
  });
  return out;
}
function startPairs(tid){
  const items = pairsCandidates(tid).slice(0, 6);
  game = { type:"pairs", theme:tid, left:shuffle(items.slice()), right:shuffle(items.slice()), sel:null, done:new Set(), bad:null, errors:0, t0:null };
  render();
}
function pairsTime(){ const g = game; return g.t0 ? Date.now() - g.t0 + g.errors * 2000 : 0; }
function renderPairs(){
  const g = game, rec = S.games.pairs[g.theme];
  if (!tick) tick = setInterval(() => { const c = $("#chrono"); if (c && game && game.type === "pairs") c.textContent = fmtS(pairsTime()); }, 100);
  const tile = (it, side) => {
    const key = side + it.id, done = g.done.has(it.id);
    return h("button", {class:"tile" + (side === "L" ? " et" : "") + (done ? " ok" : "") + (g.sel === key ? " sel" : "") + (g.bad && g.bad.includes(key) ? " bad" : ""),
      lang: side === "L" ? "et" : "fr", disabled: done, onclick:() => tapPair(it, side)}, side === "L" ? it.et : shortFr(it.fr));
  };
  return h("div", {style:"display:flex;flex-direction:column;gap:14px"},
    gameHead(h("span", {class:"chrono", id:"chrono"}, fmtS(pairsTime()))),
    h("p", {class:"hint"}, `${THEME_BY_ID[g.theme].name} · ${rec ? "record " + fmtS(rec) : "pas encore de record"} · erreur = +2 s`),
    h("div", {class:"pairs"},
      h("div", {class:"col"}, g.left.map(it => tile(it, "L"))),
      h("div", {class:"col"}, g.right.map(it => tile(it, "R"))))
  );
}
function tapPair(it, side){
  const g = game, key = side + it.id;
  if (!g.t0) g.t0 = Date.now();
  g.bad = null;
  if (!g.sel || g.sel[0] === side){ g.sel = g.sel === key ? null : key; sfx("tap"); render(); return; }
  const other = g.sel.slice(1);
  if (other === it.id){
    g.done.add(it.id); g.sel = null; sfx("ok");
    if (g.done.size === g.left.length){
      stopTick();
      const ms = pairsTime(), sec = ms / 1000, prev = S.games.pairs[g.theme];
      const record = !prev || ms < prev; if (record) S.games.pairs[g.theme] = ms;
      const xp = Math.max(10, Math.min(50, Math.round(70 - 2 * sec)));
      const tid = g.theme;
      gameOver("Paires", [`${THEME_BY_ID[tid].name} : ${fmtS(ms)}${g.errors ? ` (dont ${g.errors * 2} s de pénalité)` : ""}.`, prev ? `Ancien record : ${fmtS(prev)}.` : ""].filter(Boolean),
        xp, () => startPairs(tid), record);
      return;
    }
  } else {
    g.bad = [g.sel, key]; g.errors++; g.sel = null; sfx("no");
  }
  render();
}

// --- Vrai ou faux ---
const TF_MS = 60000;
function startTf(){
  let pool = poolItems().filter(i => S.cards[i.id]);
  if (pool.length < 12) pool = poolItems();
  if (pool.length < 4) pool = ITEMS.filter(i => i.level <= maxLevel());
  game = { type:"tf", pool, score:0, wrong:0, end:Date.now() + TF_MS, fb:null };
  nextTf();
  stopTick();
  tick = setInterval(() => {
    if (!game || game.type !== "tf"){ stopTick(); return; }
    const left = game.end - Date.now();
    if (left <= 0){ endTf(); return; }
    const b = $("#tbar"), n = $("#chrono");
    if (b){ b.firstChild.style.width = (left / TF_MS * 100) + "%"; b.classList.toggle("low", left < 10000); }
    if (n) n.textContent = Math.ceil(left / 1000) + " s";
  }, 100);
}
function nextTf(){
  const g = game, a = g.pool[Math.floor(Math.random() * g.pool.length)];
  let shown = a, truth = Math.random() < .5;
  if (!truth){
    const others = g.pool.filter(i => bare(shortFr(i.fr)) !== bare(shortFr(a.fr)));
    if (others.length) shown = others[Math.floor(Math.random() * others.length)]; else truth = true;
  }
  g.cur = { a, fr: shortFr(shown.fr), truth };
}
function answerTf(v){
  const g = game; if (!g || g.type !== "tf" || Date.now() > g.end) return;
  const c = g.cur, right = v === c.truth;
  if (right){ g.score++; sfx("ok"); g.fb = { ok:true, t:"Oui !" }; }
  else { g.wrong++; sfx("no"); g.fb = { ok:false, t:`Non : ${c.a.et} = ${shortFr(c.a.fr)}` }; }
  nextTf(); render();
}
function endTf(){
  stopTick();
  const g = game, prev = S.games.tf, record = g.score > prev;
  if (record) S.games.tf = g.score;
  gameOver("Vrai ou faux", [`${g.score} bonne${g.score > 1 ? "s" : ""} réponse${g.score > 1 ? "s" : ""}, ${g.wrong} erreur${g.wrong > 1 ? "s" : ""}.`, prev ? `Record précédent : ${prev}.` : ""].filter(Boolean),
    g.score * 2, () => { startTf(); render(); }, record && g.score > 0);
}
function renderTf(){
  const g = game, left = Math.max(0, g.end - Date.now());
  return h("div", {style:"display:flex;flex-direction:column;gap:14px"},
    gameHead(h("span", {class:"chrono", id:"chrono"}, Math.ceil(left / 1000) + " s")),
    h("div", {class:"tbar" + (left < 10000 ? " low" : ""), id:"tbar"}, h("i", {style:`width:${left / TF_MS * 100}%`})),
    h("p", {class:"hint", style:"text-align:center"}, `Score : ${g.score}` + (S.games.tf ? ` · record ${S.games.tf}` : "")),
    h("div", {class:"tf", "data-th":th(g.cur.a.theme)},
      h("div", {class:"tfe", lang:"et"}, g.cur.a.et),
      h("div", {class:"eq"}, "veut dire"),
      h("div", {class:"tff"}, g.cur.fr)),
    h("div", {class:"tfbtns"},
      h("button", {class:"v", onclick:() => answerTf(true)}, "✓ Vrai"),
      h("button", {class:"f", onclick:() => answerTf(false)}, "✗ Faux")),
    h("p", {class:"fb " + (g.fb ? (g.fb.ok ? "ok" : "no") : "")}, g.fb ? g.fb.t : "")
  );
}

    h("div", {class:"box"},
      h("p", {class:"hint", id:"voiceState"}, ""),
      h("p", {class:"hint"}, "Le son utilise la synthèse vocale de ton téléphone. Si aucune voix estonienne n'apparaît, regarde dans les réglages de synthèse vocale du téléphone si l'estonien peut être téléchargé, puis rouvre l'appli.")
    ),
    h("h2", {}, "Sauvegarde"),
    h("div", {class:"box"},
      h("p", {class:"hint"}, "Ta progression est enregistrée dans ce navigateur. Pour la passer sur un autre appareil, copie-la ici puis colle-la là-bas."),
      h("div", {class:"btns"},
        h("button", {onclick:async () => {
          const txt = JSON.stringify(S); exp.value = txt; exp.hidden = false;
          try { await navigator.clipboard.writeText(txt); msg.className = "msg"; msg.textContent = "Sauvegarde copiée."; }
          catch(e){ exp.focus(); exp.select(); msg.className = "msg"; msg.textContent = "Sélectionne le texte ci-dessous et copie-le."; }
        }}, "Copier ma progression")
      ),
      exp,
      imp,
      h("div", {class:"btns"},
        h("button", {onclick:() => {
          try { const s = JSON.parse(imp.value); if (!s || typeof s.cards !== "object") throw 0; S = merge(s); save(); msg.className = "msg"; msg.textContent = "Progression importée."; setTimeout(render, 600); }
          catch(e){ msg.className = "msg err"; msg.textContent = "Ce texte n'est pas une sauvegarde valide. Recopie-la en entier."; }
        }}, "Importer"),
        resetBtn
      ),
      msg
    ),
    h("p", {class:"hint"}, `${ITEMS.length} mots et expressions, prononciations approximatives pour francophone. Fais valider les tournures par un collègue estonien.`)
  );
}

checkBadges(true);
render();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
