<style>
/* Layout : une colonne façon appli de poche, 520px max, carte au centre, gros boutons au pouce */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EEF3;
  --ink:#0F1A24; --ink-2:#4A5865; --ink-3:#7C8995;
  --line:#D5DEE6; --accent:#0A5CAB; --accent-ink:#FFFFFF; --accent-soft:#DFEBF7;
  --good:#23744A; --good-soft:#DCEFE3; --bad:#B03F2B; --bad-soft:#F6E0DA; --warn:#94650E; --warn-soft:#F5EAD3;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --surface:#131C24; --surface-2:#1A252F;
  --ink:#E6EDF3; --ink-2:#A3B1BE; --ink-3:#74838F;
  --line:#25323D; --accent:#5DA8F2; --accent-ink:#06121D; --accent-soft:#14293C;
  --good:#5DC08B; --good-soft:#12291E; --bad:#EE826B; --bad-soft:#2E1813; --warn:#E2B158; --warn-soft:#2A2112;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --surface:#131C24; --surface-2:#1A252F;
  --ink:#E6EDF3; --ink-2:#A3B1BE; --ink-3:#74838F;
  --line:#25323D; --accent:#5DA8F2; --accent-ink:#06121D; --accent-soft:#14293C;
  --good:#5DC08B; --good-soft:#12291E; --bad:#EE826B; --bad-soft:#2E1813; --warn:#E2B158; --warn-soft:#2A2112;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 40px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-3);letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* accueil */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end;padding-top:6px}
.hero .due{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .due-l{color:var(--ink-2);font-size:15px;grid-column:1}
.streak{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.streak b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--warn)}
.streak span{font-size:13px;color:var(--ink-3)}
.cta{width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:20px;padding:18px;letter-spacing:-.01em}
.cta:disabled{opacity:.45;cursor:default}
.ghost{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px;font-weight:700;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-3)}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:8px 0 0}
.hint{color:var(--ink-3);font-size:14px;margin:0}
.themes{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.theme{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.theme:last-child{border-bottom:0}
.theme input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.theme label{display:flex;flex-direction:column;min-width:0}
.theme .tn{font-weight:700}
.theme .te{font-size:13px;color:var(--ink-3);font-style:italic}
.theme .tc{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:2/4;height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)}.bar .l{background:var(--accent)}
details.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.guide summary{font-weight:700;cursor:pointer}
.guide dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 4px}
.guide dt{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent)}
.guide dd{margin:0;color:var(--ink-2);font-size:15px;align-self:center}

/* session */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:6px}
.prog .bar i{background:var(--accent);transition:width .25s}
.prog span{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--ink-3);font-size:14px;font-weight:700;padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chip.new{color:var(--warn)}
.dirl{font-size:13px;color:var(--ink-3)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.12;letter-spacing:-.02em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.prompt.fr{font-family:var(--f-body);font-weight:700;font-size:clamp(24px,6.5vw,30px);letter-spacing:0}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.answer .a{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.answer .a.fr{font-family:var(--f-body);font-size:22px}
.pron{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.ex{font-size:15px;color:var(--ink-2)}
.say{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.verdict{border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.meh{background:var(--warn-soft);color:var(--warn)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font-size:19px}
.type input:focus{border-color:var(--accent);outline:0}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;min-width:42px;padding:7px 0;font-size:18px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:15px}
.grades small{font-weight:400;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grades .g1{color:var(--bad)}.grades .g3{color:var(--warn)}.grades .g4{color:var(--good)}.grades .g5{color:var(--accent)}
.grades .sug{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
.done p{margin:0;color:var(--ink-2)}

/* lexique */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px}
.lex{display:flex;flex-direction:column;gap:18px}
.lex h3{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.lex ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lex li{display:grid;grid-template-columns:10px 1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lex li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--accent)}.dot.k{background:var(--good)}
.lex .w{display:flex;flex-direction:column;min-width:0}
.lex .w b{overflow-wrap:anywhere}
.lex .w span{font-size:14px;color:var(--ink-2)}
.lex .w em{font-style:normal;font-size:13px;color:var(--accent)}
.lex li button{border:0;background:transparent;font-size:18px;padding:6px;color:var(--ink-3)}

/* réglages */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-weight:700}
.row small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:700}
.btns .danger{color:var(--bad)}
.msg{font-size:14px;color:var(--good);min-height:1em;margin:0}
.msg.err{color:var(--bad)}
@media (max-width:460px){.brand small{display:none}.brand{font-size:20px}.tabs button{padding:7px 10px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// ---------- SRS (SM-2) ----------
function sm2(c, q){
  // c: {n, ef, iv} ; q: 1 (raté) 3 (difficile) 4 (bien) 5 (facile)
  let n = c.n||0, ef = c.ef||2.5, iv = c.iv||0;
  if (q < 3){ n = 0; iv = 1; }
  else {
    if (n === 0) iv = (q === 5) ? 3 : 1;
    else if (n === 1) iv = (q === 3) ? 3 : 6;
    else iv = Math.max(iv + 1, Math.round(iv * ef * (q === 3 ? 0.8 : 1) * (q === 5 ? 1.3 : 1)));
    n += 1;
  }
  ef = Math.max(1.3, ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  return { n, ef: Math.round(ef*100)/100, iv };
}
function today(){ const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / 864e5); }
function fmtIv(d){ return d <= 1 ? "1 j" : d < 30 ? d + " j" : d < 365 ? Math.round(d/30) + " mois" : Math.round(d/365) + " an"; }

THEMES.forEach(t => t.words.forEach(w => ITEMS.push({ id: t.id + "|" + w[0], theme: t.id, et: w[0], fr: w[1], pr: w[2] })));
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const THEME_BY_ID = Object.fromEntries(THEMES.map(t => [t.id, t]));

const KEY = "eesti.sonad.v1";
const DEFAULT = { cards:{}, intro:{}, streak:0, lastDay:null, reviews:{},
  settings:{ size:10, newPerDay:10, dir:"mixed", mode:"flip", themes: THEMES.map(t => t.id) } };
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const s = JSON.parse(raw); return merge(s); } } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function merge(s){
  const d = JSON.parse(JSON.stringify(DEFAULT));
  const out = Object.assign(d, s || {});
  out.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT.settings)), (s && s.settings) || {});
  out.cards = out.cards || {}; out.intro = out.intro || {}; out.reviews = out.reviews || {};
  return out;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function statusOf(id){ const c = S.cards[id]; if (!c) return "n"; return c.iv >= 21 ? "k" : "l"; }
function enabledItems(){ const on = new Set(S.settings.themes); return ITEMS.filter(i => on.has(i.theme)); }
function dueItems(){ const t = today(); return enabledItems().filter(i => S.cards[i.id] && S.cards[i.id].due <= t).sort((a,b) => S.cards[a.id].due - S.cards[b.id].due); }
function newLeftToday(){ return Math.max(0, S.settings.newPerDay - (S.intro[today()] || 0)); }
function newItems(limit){ return enabledItems().filter(i => !S.cards[i.id]).slice(0, limit); }

// ---------- audio ----------
let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /^et([-_]|$)/i.test(v.lang)) || null;
  } catch(e){ VOICE = null; }
  document.querySelectorAll("[data-say]").forEach(b => b.hidden = !VOICE);
  const st = document.getElementById("voiceState");
  if (st) st.textContent = VOICE ? "Voix estonienne trouvée : " + VOICE.name : "Aucune voix estonienne sur cet appareil. L'appli marche sans le son.";
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!VOICE) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/…/g,"")); u.voice = VOICE; u.lang = VOICE.lang; u.rate = 0.85; speechSynthesis.speak(u); } catch(e){}
}

// ---------- utilitaires ----------
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function norm(s){ return s.toLowerCase().replace(/[!?.,…;:«»"'()]/g," ").replace(/\s+/g," ").trim(); }
function bare(s){ return norm(s).normalize("NFD").replace(/[̀-ͯ]/g,""); }
function check(input, target){
  const a = norm(input), b = norm(target);
  if (!a) return "no";
  if (a === b) return "ok";
  if (bare(a) === bare(b)) return "meh";
  return "no";
}

}

// ---------- session ----------
let session = null;
function start(bonus){
  let due = dueItems().slice(0, S.settings.size);
  let fresh = newItems(bonus ? S.settings.size : newLeftToday()).slice(0, S.settings.size - due.length);
  if (bonus && !fresh.length){
    // tout est vu : révision anticipée des cartes les plus proches
    due = enabledItems().filter(i => S.cards[i.id]).sort((a,b) => S.cards[a.id].due - S.cards[b.id].due).slice(0, S.settings.size);
  }
  const q = [...due, ...fresh].map(i => ({ item:i, isNew: !S.cards[i.id], again:false }));
  if (!q.length){ return; }
  // mélange léger : les nouvelles intercalées
  for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [q[i], q[j]] = [q[j], q[i]]; }
  session = { queue:q, pos:0, total:q.length, revealed:false, typed:null, verdict:null, correct:0, seen:0 };
  prepCard(); render();
}
function prepCard(){
  const cur = session.queue[session.pos]; if (!cur) return;
  const d = S.settings.dir;
  cur.dir = cur.isNew && !cur.again ? "et" : d === "mixed" ? (Math.random() < .5 ? "et" : "fr") : d;
  session.revealed = false; session.typed = null; session.verdict = null;
}
function renderSession(){
  const s = session, cur = s.queue[s.pos];
  if (!cur) return renderDone();
  const it = cur.item, theme = THEME_BY_ID[it.theme];
  const typing = S.settings.mode === "type" && cur.dir === "fr";
  const promptText = cur.dir === "et" ? it.et : it.fr;
  const wrap = h("div", {style:"display:flex;flex-direction:column;gap:14px"});
  wrap.append(h("div", {class:"prog"},
    h("button", {class:"x", onclick:() => { session = null; render(); }}, "✕ Quitter"),
    h("div", {class:"bar"}, h("i", {style:`width:${s.pos/s.queue.length*100}%`})),
    h("span", {}, `${Math.min(s.pos+1, s.queue.length)} / ${s.queue.length}`)
  ));
  const card = h("div", {class:"card"});
  card.append(h("div", {class:"card-top"},
    h("span", {class:"chip" + (cur.isNew ? " new" : "")}, cur.isNew ? "Nouveau · " + theme.name : theme.name),
    h("span", {class:"dirl"}, cur.dir === "et" ? "ET → FR" : "FR → ET")
  ));
  card.append(h("div", {class:"prompt" + (cur.dir === "fr" ? " fr" : ""), lang: cur.dir === "et" ? "et" : "fr"}, promptText));
  if (cur.dir === "et") card.append(h("div", {}, h("button", {class:"say", "data-say":true, onclick:() => say(it.et)}, "🔊 Écouter")));

  if (!s.revealed){
    if (typing){
      const inp = h("input", {id:"ans", type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", lang:"et", placeholder:"Écris en estonien…", "aria-label":"Ta réponse en estonien",
        onkeydown:e => { if (e.key === "Enter") submitTyped(); }});
      card.append(h("div", {class:"type"}, inp));
      card.append(h("div", {class:"keys"}, ["õ","ä","ö","ü","š","ž"].map(ch => h("button", {type:"button", onclick:() => { const i = $("#ans"); const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0,p) + ch + i.value.slice(p); i.focus(); i.setSelectionRange(p+1,p+1); }}, ch))));
      wrap.append(card, h("button", {class:"cta", onclick:submitTyped}, "Vérifier"));
      setTimeout(() => { const i = $("#ans"); if (i) i.focus(); }, 30);
    } else {
      wrap.append(card, h("button", {class:"cta", onclick:() => { s.revealed = true; render(); if (cur.dir === "fr") say(it.et); }}, "Voir la réponse"));
    }
    return wrap;
  }

  const ans = h("div", {class:"answer"});
  if (s.verdict){
    const msg = { ok:"Exact !", meh:"Presque : attention aux lettres accentuées.", no:"Pas tout à fait." }[s.verdict];
    ans.append(h("div", {class:"verdict " + s.verdict}, msg + (s.verdict !== "ok" && s.typed ? ` Tu as écrit « ${s.typed} ».` : "")));
  }
  ans.append(h("div", {class:"a" + (cur.dir === "et" ? " fr" : ""), lang: cur.dir === "et" ? "fr" : "et"}, cur.dir === "et" ? it.fr : it.et));
  ans.append(h("div", {class:"pron"}, "[ " + it.pr + " ]"));
  if (cur.dir === "fr") ans.append(h("div", {}, h("button", {class:"say", "data-say":true, onclick:() => say(it.et)}, "🔊 Écouter")));
  card.append(ans);
  wrap.append(card);

  const c = S.cards[it.id] || {n:0, ef:2.5, iv:0};
  const sug = s.verdict === "ok" ? 4 : s.verdict === "meh" ? 3 : s.verdict === "no" ? 1 : null;
  wrap.append(h("div", {class:"grades"}, [[1,"Raté"],[3,"Difficile"],[4,"Bien"],[5,"Facile"]].map(([q,l]) =>
    h("button", {class:"g"+q + (sug === q ? " sug" : ""), onclick:() => grade(q)}, l, h("small", {}, q < 3 ? "à revoir" : fmtIv(sm2(c,q).iv)))
  )));
  return wrap;
}
function submitTyped(){
  const s = session, cur = s.queue[s.pos], i = $("#ans");
  const v = i ? i.value : "";
  s.typed = v.trim(); s.verdict = check(v, cur.item.et); s.revealed = true; render(); say(cur.item.et);
}
function grade(q){
  const s = session, cur = s.queue[s.pos], id = cur.item.id, t = today();
  if (cur.isNew && !cur.again){ S.intro[t] = (S.intro[t] || 0) + 1; }
  const prev = S.cards[id] || {n:0, ef:2.5, iv:0};
  const next = sm2(prev, q);
  S.cards[id] = { ...next, due: t + next.iv, last: t };
  S.reviews[t] = (S.reviews[t] || 0) + 1;
  s.seen++; if (q >= 3) s.correct++;
  if (q < 3 && !cur.again) s.queue.push({ item: cur.item, isNew: cur.isNew, again: true });
  // série
  if (S.lastDay !== t){ S.streak = (S.lastDay === t - 1) ? S.streak + 1 : 1; S.lastDay = t; }
  // garde seulement 60 jours d'historique
  for (const k of Object.keys(S.intro)) if (+k < t - 60) delete S.intro[k];
  for (const k of Object.keys(S.reviews)) if (+k < t - 60) delete S.reviews[k];
  save();
  s.pos++; prepCard(); render();
}
function renderDone(){
  const s = session;
  const pct = s.seen ? Math.round(s.correct / s.seen * 100) : 0;
  return h("div", {class:"done"},
    h("div", {class:"big"}, "Tubli!"),
    h("p", {}, `Session terminée : ${s.total} cartes, ${pct} % de réponses réussies.`),
    h("p", {}, `Série : ${S.streak} jour${S.streak > 1 ? "s" : ""} d'affilée.`),
    h("button", {class:"cta", onclick:() => { session = null; go("home"); }}, "Retour à l'accueil"),
    h("button", {class:"ghost", onclick:() => start(true)}, "Encore une session")
  );
}

// ---------- lexique ----------
let lexQuery = "";
function renderLex(){
  const wrap = h("div", {style:"display:flex;flex-direction:column;gap:14px"});
  const inp = h("input", {class:"search", id:"lexq", type:"search", placeholder:"Chercher un mot (estonien ou français)", value:lexQuery,
    oninput:e => { lexQuery = e.target.value; fill(); }});
  const list = h("div", {class:"lex"});
  const legend = h("p", {class:"hint"}, "● bleu : en cours d'apprentissage · ● vert : maîtrisé (révision dans 3 semaines ou plus)");
  wrap.append(inp, legend, list);
  function fill(){
    list.replaceChildren();
    const q = bare(lexQuery);
    THEMES.forEach(t => {
      const rows = t.words.filter(w => !q || bare(w[0]).includes(q) || bare(w[1]).includes(q));
      if (!rows.length) return;
      list.append(h("section", {}, h("h3", {}, t.name), h("ul", {}, rows.map(w => {
        const id = t.id + "|" + w[0];
        return h("li", {},
          h("span", {class:"dot " + statusOf(id)}),
          h("div", {class:"w"}, h("b", {lang:"et"}, w[0]), h("span", {}, w[1]), h("em", {}, w[2])),
          h("button", {"data-say":true, "aria-label":"Écouter " + w[0], onclick:() => say(w[0])}, "🔊")
        );
      }))));
    });
    if (!list.children.length) list.append(h("p", {class:"hint"}, "Aucun mot ne correspond."));
    pickVoice();
  }
  fill();
  return wrap;
}

// ---------- réglages ----------
function seg(key, opts){
  return h("div", {class:"seg"}, opts.map(([v,l]) => h("button", {"aria-pressed": String(S.settings[key] === v), onclick:() => { S.settings[key] = v; save(); render(); }}, l)));
}
function renderSettings(){
  const exp = h("textarea", {id:"exportBox", readonly:true, hidden:true});
  const imp = h("textarea", {id:"importBox", placeholder:"Colle ici une sauvegarde…"});
  const msg = h("p", {class:"msg", id:"msg"});
  let armedReset = false;
  const resetBtn = h("button", {class:"danger", onclick:() => {
    if (!armedReset){ armedReset = true; resetBtn.textContent = "Confirmer : tout effacer"; return; }
    S = JSON.parse(JSON.stringify(DEFAULT)); save(); render();
  }}, "Remettre à zéro");
  return h("div", {style:"display:flex;flex-direction:column;gap:14px"},
    h("h2", {}, "Sessions"),
    h("div", {class:"set"},
      h("div", {class:"row"}, h("label", {}, "Cartes par session"), seg("size", [[10,"10"],[20,"20"],[30,"30"]])),
      h("div", {class:"row"}, h("label", {}, "Nouveaux mots / jour", h("small", {}, "10 suffit pour tenir sans saturer")), seg("newPerDay", [[5,"5"],[10,"10"],[20,"20"]])),
      h("div", {class:"row"}, h("label", {}, "Sens"), seg("dir", [["et","ET→FR"],["fr","FR→ET"],["mixed","Mixte"]])),
      h("div", {class:"row"}, h("label", {}, "Réponse", h("small", {}, "« Écrire » s'applique quand tu dois trouver le mot estonien")), seg("mode", [["flip","Retourner"],["type","Écrire"]]))
    ),
    h("h2", {}, "Son"),
    h("div", {class:"box"},
      h("p", {class:"hint", id:"voiceState"}, ""),
      h("p", {class:"hint"}, "Le son utilise la synthèse vocale de ton téléphone. Si aucune voix estonienne n'apparaît, regarde dans les réglages de synthèse vocale du téléphone si l'estonien peut être téléchargé, puis rouvre l'appli.")
    ),
    h("h2", {}, "Sauvegarde"),
    h("div", {class:"box"},
      h("p", {class:"hint"}, "Ta progression est enregistrée dans ce navigateur. Pour la passer sur un autre appareil, copie-la ici puis colle-la là-bas."),
      h("div", {class:"btns"},
        h("button", {onclick:async () => {
          const txt = JSON.stringify(S); exp.value = txt; exp.hidden = false;
          try { await navigator.clipboard.writeText(txt); msg.className = "msg"; msg.textContent = "Sauvegarde copiée."; }
          catch(e){ exp.focus(); exp.select(); msg.className = "msg"; msg.textContent = "Sélectionne le texte ci-dessous et copie-le."; }
        }}, "Copier ma progression")
      ),
      exp,
      imp,
      h("div", {class:"btns"},
        h("button", {onclick:() => {
          try { const s = JSON.parse(imp.value); if (!s || typeof s.cards !== "object") throw 0; S = merge(s); save(); msg.className = "msg"; msg.textContent = "Progression importée."; setTimeout(render, 600); }
          catch(e){ msg.className = "msg err"; msg.textContent = "Ce texte n'est pas une sauvegarde valide. Recopie-la en entier."; }
        }}, "Importer"),
        resetBtn
      ),
      msg
    ),
    h("p", {class:"hint"}, `${ITEMS.length} mots et expressions, prononciations approximatives pour francophone. Fais valider les tournures par un collègue estonien.`)
  );
}

render();
</script>
